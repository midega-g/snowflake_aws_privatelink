name: 'Terraform CI/CD'

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-west-2
  TF_VERSION: '1.10'
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
  SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  # =============================================================================
  # PLAN — runs on PRs and pushes to main
  # =============================================================================

  plan-networking:
    name: 'Plan: 01_networking'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/01_networking
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 01_networking \`${{ steps.plan.outcome }}\`

            <details><summary>Plan Output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  plan-privatelink:
    name: 'Plan: 02_privatelink'
    runs-on: ubuntu-latest
    needs: plan-networking
    defaults:
      run:
        working-directory: terraform/02_privatelink
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -var='snowflake_profile=null'
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 02_privatelink \`${{ steps.plan.outcome }}\`

            <details><summary>Plan Output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # =============================================================================
  # APPLY — only on push to main (after merge)
  # =============================================================================

  apply-networking:
    name: 'Apply: 01_networking'
    runs-on: ubuntu-latest
    needs: plan-networking
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: sandbox
    defaults:
      run:
        working-directory: terraform/01_networking
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

  apply-privatelink:
    name: 'Apply: 02_privatelink'
    runs-on: ubuntu-latest
    needs: [plan-privatelink, apply-networking]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: sandbox
    defaults:
      run:
        working-directory: terraform/02_privatelink
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var='snowflake_profile=null'

  # =============================================================================
  # NOTE: 03_ec2_test and 04_network_policy are excluded from CI/CD
  #
  # 03_ec2_test: Ephemeral test instances — manual apply/destroy only
  # 04_network_policy: Requires operator_ip which changes constantly —
  #   must be applied manually with current IP
  # =============================================================================
